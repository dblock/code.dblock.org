<div class="navigation-wrapper">
	<div class="site-name">
		<!--<a href="{{ site.url }}/">{{ site.title }}</a>-->
	</div><!-- /.site-name -->
	<div class="top-navigation">
		<nav role="navigation" id="site-nav" class="nav sliding-menu-content">
		    <ul>
	        {% for link in site.data.navigation %}
				    {% if link.url contains 'http' %}
				        {% assign navigation_url = link.url %}
				        {% else %}
				        {% assign navigation_url = link.url | relative_url %}
				    {% endif %}
				    <li><a href="{{ navigation_url }}" {% if link.url contains 'http' %}target="_blank"{% endif %}>{{ link.title }}</a></li>
					{% endfor %}
		    </ul>
		</nav>
	</div><!-- /.top-navigation -->
</div><!-- /.navigation-wrapper -->
