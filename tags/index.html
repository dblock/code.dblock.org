---
layout: default
title: Tagged
---
<h1>Tagged</h1>
<div class="topic-controls">
<div>
<label for="topic-search">Find a topic</label>
<input id="topic-search" type="search" placeholder="Search ...">
</div>
<div>
<label for="topic-sort">Sort</label>
<select id="topic-sort">
  <option value="name">Alphabetical</option>
  <option value="count">Most posts</option>
  <option value="latest">Recently updated</option>
</select>
</div>
</div>
<p id="topic-status" aria-live="polite"></p>
<ul id="topic-list">
  {% for topic in site.data.topic_index %}
    <li data-name="{{ topic.name | escape }}" data-description="{{ topic.description | escape }}" data-count="{{ topic.count }}" data-latest="{{ topic.latest }}"><a href="{{ topic.url | relative_url }}">{{ topic.name }}</a> ({{ topic.count }}) — latest {{ topic.latest }}{% if topic.description != "" %}<p>{{ topic.description }}</p>{% endif %}</li>
  {% endfor %}
</ul>
<script src="{{ '/assets/js/topics.js' | relative_url }}" defer></script>
<style>
.topic-controls { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1.5rem; margin: 1.5rem 0; }
.topic-controls label { display: block; margin-bottom: .5rem; }
.topic-controls input, .topic-controls select { margin: 0; max-width: 100%; font-size: .875rem; }
#topic-status { margin: 1rem 0; }
#topic-list { padding-left: 1.5rem; }
#topic-list > li p { margin: 0; }
</style>
