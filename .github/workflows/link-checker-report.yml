name: Publish Link Checker Report

on:
  workflow_run:
    workflows: [Check Links]
    types: [completed]

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  publish:
    # Comments on pull requests, and keeps the broken links issue up to date on gh-pages.
    uses: dblock/jekyll-ruby-link-checker/.github/workflows/publish-report.yml@2a751b074670ffdd342a38a8764c409f649027ae # master
    with:
      issue: '181'
