name: Check Markdown and Ruby
on:
  push:
    branches: [gh-pages]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Check Markdown and Ruby
        run: bundle exec rake lint
