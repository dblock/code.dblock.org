name: Deploy to GitHub Pages

on:
  push:
    branches:
      - gh-pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Copy markdown source files
        run: |
          # Copy post markdown files to _site
          find _posts -name "*.md" -o -name "*.markdown" | while read file; do
            # Extract date and slug from filename
            filename=$(basename "$file")
            # Match pattern: YYYY-MM-DD-slug.md or .markdown
            if [[ $filename =~ ^([0-9]{4})-([0-9]{2})-([0-9]{2})-(.+)\.(md|markdown)$ ]]; then
              year="${BASH_REMATCH[1]}"
              month="${BASH_REMATCH[2]}"
              day="${BASH_REMATCH[3]}"
              slug="${BASH_REMATCH[4]}"
              dest="_site/${year}/${month}/${day}/${slug}.md"
              mkdir -p "$(dirname "$dest")"
              cp "$file" "$dest"
              echo "Copied $file -> $dest"
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
