name: Deploy to GitHub Pages

on:
  push:
    branches:
      - gh-pages
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libvips and Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-tools
          mkdir -p ~/.local/share/fonts
          cp _og/fonts/*.ttf ~/.local/share/fonts/
          fc-cache -f

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Restore Social Cards
        uses: actions/cache@v6
        with:
          path: images/og
          key: og-images-${{ github.run_id }}
          restore-keys: og-images-

      - name: Run integration tests
        run: bundle exec rake test

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
